name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # No secrets needed: server env is validated lazily on first request,
      # so the build proves the app compiles without a database configured.
      - run: npm run build

  database:
    name: Migrations, pgTAP, integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      # Starting from an empty database replays every migration and the seed,
      # so this step fails if the migration history stops being replayable.
      - name: Start Supabase
        run: supabase start -x studio

      - name: pgTAP tests
        run: supabase test db

      - name: Generated types are up to date
        run: |
          supabase gen types typescript --local > "$RUNNER_TEMP/supabase.ts"
          diff -u lib/types/supabase.ts "$RUNNER_TEMP/supabase.ts"

      - name: Export local Supabase credentials
        run: |
          eval "$(supabase status -o env)"
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Wait for the REST API
        run: |
          for attempt in $(seq 1 30); do
            curl -sf "$SUPABASE_URL/rest/v1/" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" > /dev/null && exit 0
            sleep 2
          done
          echo "PostgREST did not become ready" >&2
          exit 1

      - name: Integration tests
        run: npm run test:integration
        env:
          SUPABASE_INTEGRATION: "1"
